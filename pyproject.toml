[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-cot-sentinel"
version = "0.1.0"
description = "Step-checked chain of thought for llama-server: a decision model (Clef / Clef-Flash, any SystemOne API) reviews every reasoning step and steers the model with rollback or reflection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "llama-cot-sentinel contributors" }]
keywords = ["llama.cpp", "llama-server", "chain-of-thought", "reasoning", "guardrails", "decision-model", "clef", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24",
    "starlette>=0.27",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
llama-cot-sentinel = "llama_cot_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_cot_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
